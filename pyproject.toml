[project]
name = "divsample"
version = "1.0.0"
description = "Code for 'Diversity Sampling Costs Labels Near the Training Pool and Saves Them Far From It' (AI4Mat-NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
# Exact versions: RDKit, scikit-learn and numpy decide the fingerprints, the
# splits and the selected training sets, so other versions may not reproduce them.
dependencies = [
    "numpy==1.26.4",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "rdkit==2026.3.3",
    "torch==2.13.0",
    "chemprop==2.2.4",
    "lightning==2.6.5",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divsample"]

[tool.pytest.ini_options]
testpaths = ["tests"]
